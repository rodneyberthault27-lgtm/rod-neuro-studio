<title>ROD Neuro Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Permanent+Marker&display=swap">
<style>
/* Layout: barra fixa com marca + análise + abas; abaixo, uma vista por vez (Painel, Simulador, Histórico, Pergunte). */
:root{
  --bg:#f1f0ec; --surface:#ffffff; --ink:#131313; --mute:#5d5b56; --line:#dddbd5; --soft:#e8e6e0;
  --accent:#ffcf1a; --on-accent:#131313;
  --ok:#137a51; --warn:#9a6a00; --bad:#c2392b; --na:#9a978f;
  --okbg:#dff2e8; --warnbg:#fbefcf; --badbg:#fadfda; --nabg:#ebe9e3;
  --gold:#8a6600; --silver:#5f6470; --purple:#6a4cc8;
  --lv-prev:#1f6fb8; --lv-hip:#7a4fc0; --lv-res:#137a51;
  --f-display:"Space Grotesk",Inter,system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-tag:"Permanent Marker","Space Grotesk",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0f0f; --surface:#1a1a19; --ink:#f1f0ec; --mute:#a3a19b; --line:#2c2c2a; --soft:#242423;
  --okbg:#13352a; --warnbg:#3a2f0e; --badbg:#3c1c17; --nabg:#262624;
  --gold:#e3b52a; --silver:#a9aeb8; --purple:#a48cf0; --lv-prev:#6db3f2; --lv-hip:#b79cf5; --lv-res:#4fcf94; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f0f0f; --surface:#1a1a19; --ink:#f1f0ec; --mute:#a3a19b; --line:#2c2c2a; --soft:#242423;
  --okbg:#13352a; --warnbg:#3a2f0e; --badbg:#3c1c17; --nabg:#262624;
  --gold:#e3b52a; --silver:#a9aeb8; --purple:#a48cf0; --lv-prev:#6db3f2; --lv-hip:#b79cf5; --lv-res:#4fcf94; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15.5px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:30px;height:auto;color:var(--ink)}
.brand b{font-family:var(--f-tag);font-size:22px;font-weight:400;letter-spacing:.02em}
.brand span{font-family:var(--f-display);font-weight:600;color:var(--mute);font-size:14px}
.pick{display:flex;align-items:center;gap:8px;min-width:0}
.pick label{font-size:13px;color:var(--mute);font-weight:600}
select{background:var(--soft);color:var(--ink);border:0;border-radius:10px;padding:8px 10px;font:600 14px var(--f-body);max-width:min(60vw,320px)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;overflow-x:auto;max-width:100%}
.tabs a{text-decoration:none;color:var(--mute);font:600 14px var(--f-display);padding:7px 12px;border-radius:9px;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.main{max-width:1240px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:700 clamp(26px,4vw,40px)/1.08 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font:700 20px/1.2 var(--f-display);margin:0;letter-spacing:-.01em}
h3{font:650 16.5px/1.3 var(--f-display);margin:0}
.lead{color:var(--mute);margin:6px 0 0;max-width:68ch}
.sec{margin-top:28px}
.shead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:12px}
.shead p{margin:0;color:var(--mute);font-size:14.5px}
.card{background:var(--surface);border-radius:16px;padding:18px;min-width:0}
.grid{display:grid;gap:14px}
.auto{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px}
.chip b{color:var(--mute);font-weight:600;margin-right:4px}
.ev{font:700 11.5px/1 var(--f-body);letter-spacing:.04em;border-radius:999px;padding:4px 9px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.ev::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ev-ROBUSTO{color:var(--gold);background:color-mix(in srgb,var(--gold) 15%,transparent)}
.ev-CONTEXTUAL{color:var(--silver);background:color-mix(in srgb,var(--silver) 16%,transparent)}
.ev-TESTAR{color:var(--purple);background:color-mix(in srgb,var(--purple) 15%,transparent)}
details.how{margin-top:10px;font-size:14px;color:var(--mute)}
details.how summary{cursor:pointer;font-weight:600;color:var(--ink);list-style:none;display:inline-flex;align-items:center;gap:8px}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"?";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--soft);font-size:12px}
details.how p{margin:8px 0 0}
.empty{background:var(--surface);border-radius:16px;padding:28px;max-width:720px}
.empty h2{margin-bottom:8px}
.empty ol{margin:10px 0 0;padding-left:20px}
.note{font-size:13.5px;color:var(--mute)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}

/* painel */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;margin-top:20px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.peca{display:grid;place-items:center;background:var(--surface);border-radius:16px;padding:16px;min-height:220px}
.peca img{max-height:360px;object-fit:contain;border-radius:8px}
.gauge{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.big{font:700 52px/1 var(--f-display)}
.big small{font-size:22px;color:var(--mute)}
.verdict{font:650 18px/1.3 var(--f-display);margin:4px 0 0}
.resumo{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:16px}
.quote{margin:0 0 14px;font:600 clamp(18px,2.3vw,23px)/1.35 var(--f-display);letter-spacing:-.01em}
.ibox{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.ibox div{background:var(--soft);border-radius:12px;padding:10px 12px}
.lab{display:block;font:700 12px/1.3 var(--f-body);color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.iprow{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1.2fr);gap:14px;padding:11px 0;align-items:start}
.iprow + .iprow{border-top:1px solid var(--line)}
@media (max-width:700px){.iprow{grid-template-columns:1fr;gap:4px}.ihead{display:none}}
.st{display:inline-flex;align-items:center;gap:8px;font-weight:650}
.ic{flex:none;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.i-ok{background:var(--ok)} .i-parcial{background:var(--warn)} .i-falha{background:var(--bad)} .i-na{background:var(--na)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .45s ease}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.score{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.score small{font-size:13px;color:var(--mute)}
.ci{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:12px;font-size:14px}
.ci b{display:block}
.ci span.n{color:var(--mute);font-size:13px}
.s-ok{background:var(--okbg)} .s-parcial{background:var(--warnbg)} .s-falha{background:var(--badbg)} .s-na{background:var(--nabg)}
.sem{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.semc{border-radius:16px;padding:16px}
.semc ul{margin:8px 0 0;padding-left:18px} .semc li{margin:3px 0}
.fix{background:var(--surface);border-radius:16px;padding:16px;display:flex;gap:12px}
.fix + .fix{margin-top:10px}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800}
.rows{display:grid;grid-template-columns:76px 1fr;gap:4px 12px;font-size:14.5px;margin-top:6px}
.rows dt{color:var(--mute);font-weight:600} .rows dd{margin:0;min-width:0}
.ex{background:var(--soft);border-radius:10px;padding:7px 11px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font:650 12.5px var(--f-body);border-radius:999px;padding:3px 10px;background:var(--soft)}
.corr{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.corr{grid-template-columns:1fr}}
.matrix svg{width:100%;max-width:330px;display:block;margin:0 auto}
figure{margin:0;background:var(--surface);border-radius:16px;padding:12px}
figure img{width:100%;border-radius:10px;display:block}
figcaption{font-size:14px;color:var(--mute);margin-top:8px}
figure.wide{grid-column:1/-1}
.vc.rec{box-shadow:inset 0 0 0 2px var(--ink)}
.tagrec{display:inline-block;font:700 11.5px var(--f-body);letter-spacing:.05em;background:var(--accent);color:var(--on-accent);border-radius:6px;padding:2px 7px;margin-bottom:6px}
.sapl{margin:10px 0 0;background:var(--soft);border-radius:10px;padding:9px 11px;font-size:14.5px}
.sfonte{margin:8px 0 0;font-size:13px;color:var(--mute)}
.radar svg{width:100%;max-width:400px;display:block;margin:0 auto}

/* simulador */
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start;margin-top:18px}
@media (max-width:920px){.sim{grid-template-columns:1fr}}
.stage{background:#0d0d0f;border-radius:16px;position:relative;overflow:hidden;height:min(56vh,440px);min-height:300px}
.stage canvas{display:block;width:100%;height:100%}
.stage .hint{position:absolute;left:12px;top:10px;color:#cfcfcf;font-size:12.5px;pointer-events:none}
.stage .vis{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.stage .vis button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.lbl3d{position:absolute;transform:translate(-50%,-150%);padding:2px 8px;border-radius:999px;font:650 12px var(--f-body);white-space:nowrap;pointer-events:none;background:rgba(15,15,15,.85);color:#fff}
.meters{margin-top:14px}
.meter{display:grid;grid-template-columns:96px minmax(0,1fr) 54px;gap:10px;align-items:center;padding:6px 0}
.meter b{font:600 14px var(--f-display)}
.meter .val{font:700 16px var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.delta{font-size:12px;font-weight:700;margin-left:4px}
.up{color:var(--ok)} .down{color:var(--bad)}
.hud{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.mission{min-width:0}
.mission .bar{height:12px;margin-top:6px}
.decks{display:grid;gap:16px}
.deck h3{margin-bottom:8px;display:flex;align-items:center;gap:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.cc{position:relative;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 11px 11px;cursor:pointer;min-height:92px;
  display:flex;flex-direction:column;gap:6px;transition:transform .12s ease, background .15s ease}
.cc:hover{transform:translateY(-2px)}
.cc .cn{font:650 14px/1.25 var(--f-display)}
.cc .gem{width:10px;height:10px;border-radius:50%;flex:none}
.cc .row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.cc .tiny{font-size:11.5px;color:var(--mute);font-weight:600}
.cc[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cc[aria-pressed="true"] .tiny{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.cc.trap{border-style:dashed}
.cc .sug{position:absolute;top:-8px;right:8px;background:var(--accent);color:var(--on-accent);font:700 10.5px var(--f-body);border-radius:6px;padding:1px 6px}
.cc .orig{position:absolute;top:-8px;left:8px;background:var(--soft);color:var(--ink);font:700 10.5px var(--f-body);border-radius:6px;padding:1px 6px}
.explain{margin-top:14px}
.explain .big-t{font:650 17px/1.35 var(--f-display);margin:6px 0 0}
.alerts{display:grid;gap:8px;margin-top:12px}
.alert{border-radius:12px;padding:10px 12px;font-size:14px}
.a-bad{background:var(--badbg)} .a-ok{background:var(--okbg)} .a-warn{background:var(--warnbg)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:9px 16px;font:650 14px var(--f-display);cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}

/* histórico e pergunte */
.hist{display:grid;gap:10px}
.hi{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;border:0;text-align:left;width:100%}
.hi .nota{font:700 26px var(--f-display);min-width:48px;text-align:center}
.hi .meta{color:var(--mute);font-size:13.5px}
.ask textarea{width:100%;min-height:96px;background:var(--soft);color:var(--ink);border:0;border-radius:12px;padding:12px;font:15px/1.5 var(--f-body);resize:vertical}
.chat{display:grid;gap:10px;margin-top:14px}
.msg{border-radius:14px;padding:12px 14px;white-space:pre-wrap;max-width:80ch}
.msg.u{background:var(--ink);color:var(--bg);justify-self:end}
.msg.c{background:var(--surface)}
.lvl{display:inline-flex;align-items:center;gap:6px;font:700 11.5px/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:5px 8px;white-space:nowrap}
.lvl::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.lvl-prev{color:var(--lv-prev);background:color-mix(in srgb,var(--lv-prev) 14%,transparent)}
.lvl-hip{color:var(--lv-hip);background:color-mix(in srgb,var(--lv-hip) 14%,transparent)}
.lvl-res{color:var(--lv-res);background:color-mix(in srgb,var(--lv-res) 14%,transparent)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px;margin-top:16px}
.levels div{background:var(--surface);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--mute)}
.levels b{display:block;color:var(--ink);margin-top:6px}
.tagline{font:600 13px var(--f-display);color:var(--mute)}
@media (max-width:700px){.tagline{display:none}}
.explain a{color:var(--ink);font-weight:700}
.form label{display:block;font:600 13px var(--f-body);color:var(--mute);margin:12px 0 4px}
.form input,.form textarea{width:100%;background:var(--soft);color:var(--ink);border:0;border-radius:10px;padding:10px 12px;font:15px/1.4 var(--f-body)}
.form textarea{min-height:84px;resize:vertical}
.form fieldset{border:0;padding:0;margin:14px 0 0}
.form legend{font:700 15px var(--f-display);padding:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:0 12px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,110px),1fr));gap:0 10px}
.jor{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.etapa{background:var(--surface);border-radius:14px;padding:14px;min-width:0}
.etapa h3{margin-top:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* =========================================================
   DADOS FIXOS: leituras, regiões do cérebro e cartas do jogo
   ========================================================= */
const LEIT = [
  {k:"atencao",  n:"Atenção",   teen:"É a peça ser notada. O cérebro ignora quase tudo que vê; só passa o que tem contraste, rosto, movimento ou algo fora do padrão."},
  {k:"carga",    n:"Carga",     teen:"É o esforço para entender. Quanto mais fácil, mais a pessoa confia. Se ela precisa pensar demais, ela desiste e rola o feed."},
  {k:"emocao",   n:"Emoção",    teen:"É o que a pessoa sente. Sem sentir nada, o cérebro não dá importância e não guarda. Dá para dizer a emoção em uma palavra?"},
  {k:"memoria",  n:"Memória",   teen:"É o que sobra depois. Marca lembrada é marca escolhida. Repetir algo só seu (cor, forma, frase) é o que gruda."},
  {k:"confianca",n:"Confiança", teen:"É acreditar. Promessa sem prova acende o modo desconfiado. Números reais, gente real e garantia acalmam."},
  {k:"decisao",  n:"Decisão",   teen:"É saber o que fazer agora. Um botão claro e poucos passos. Cada caminho extra é uma chance de ir embora."}
];
const NORM = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const LKEY = {}; LEIT.forEach(l=>{LKEY[NORM(l.n)]=l.k; LKEY[l.k]=l.k;});

const ATLAS = {
  visual:{nome:"Córtex visual", p:[0.32,0.08,-0.97], bi:1, prof:0},
  fusiforme:{nome:"Giro fusiforme (rostos)", p:[0.5,-0.36,-0.42], bi:1, prof:0},
  parietal:{nome:"Parietal (atenção dirigida)", p:[0.56,0.5,-0.5], bi:1, prof:0},
  tpj:{nome:"Junção temporoparietal", p:[0.76,0.14,-0.42], bi:1, prof:0},

  {

const LVL = {prev:["Previsão visual","modelo de saliência, não medição"],hip:["Hipótese comportamental","baseada em evidência, não medição"],res:["Resultado observado","dado real de campanha"]};
const lvl = k => `<span class="lvl lvl-${k}" title="${LVL[k][1]}">${LVL[k][0]}</span>`;

function calcular(){
  const diff={}; LEIT.forEach(l=>diff[l.k]=0); const alerts=[];
  const soma=(set,s)=>set.forEach(id=>Object.entries(CMAP[id].e).forEach(([k,v])=>diff[k]+=s*v));
  soma(ativas,1); soma(iniciais,-1);
  const comb=g=>COMBOS.filter(c=>c.all.every(i=>g.has(i)));
  comb(ativas).forEach(c=>{Object.entries(c.e).forEach(([k,v])=>diff[k]+=v);alerts.push({t:"ok",m:c.t.replace("Combo:","Reforço:")});});
  comb(iniciais).forEach(c=>Object.entries(c.e).forEach(([k,v])=>diff[k]-=v));
  const pos=[...ativas].filter(i=>!CMAP[i].trap).length;
  if(pos>7){ alerts.push({t:"warn",m:`Mecanismos demais (${pos}): cada um disputa atenção com os outros. Escolha os que atacam as barreiras mais importantes.`}); diff.carga-=1; }
  if(ativas.has("perda")&&!ativas.has("garantia")&&!ativas.has("cta_unico")) alerts.push({t:"warn",m:"Conflito: mostrar a perda sem garantia ou ação clara tende a gerar ansiedade, não ação. Ligue \"Garantia\" ou \"Um botão claro\"."});
  if(ativas.has("perda")&&ativas.has("historia")) alerts.push({t:"warn",m:"Atenção à ordem: medo e pertencimento no mesmo bloco se anulam. Conte a história primeiro, a perda depois."});
  if(ativas.has("escassez_falsa")) alerts.push({t:"bad",m:"Risco legal: escassez falsa é propaganda enganosa (CDC art. 37). Troque por \"Prazo ou vaga real\"."});
  return {diff,alerts};
}
function barreirasDaAnalise(){
  const b=(atual&&atual.barreiras)||[];
  if(b.length) return b.filter(x=>BARR[x.id]).map(x=>({id:x.id,nome:x.nome||BARR[x.id].n,peso:x.peso||"médio"}));
  return Object.keys(BARR).map(id=>({id,nome:BARR[id].n,peso:""}));
}
function statusBarreiras(){
  return barreirasDaAnalise().map(b=>{
    const ajuda=[...ativas].filter(i=>!CMAP[i].trap&&(EXTRA[i]||{}).b&&EXTRA[i].b.includes(b.id));
    const piora=[...ativas].filter(i=>CMAP[i].trap&&(EXTRA[i]||{}).b&&EXTRA[i].b.includes(b.id));
    return {...b,ajuda,piora,st:piora.length?"falha":ajuda.length?"ok":"na"};
  });
}
function regioesAtivas(){
  const m={};
  ativas.forEach(id=>Object.entries(CMAP[id].r).forEach(([r,v])=>m[r]=Math.max(m[r]||0,v)));
  if(!ativas.size&&atual&&atual.cerebro) atual.cerebro.forEach(r=>{if(ATLAS[r.id]) m[r.id]=Math.max(m[r.id]||0,Number(r.intensidade)||.5);});
  return m;
}
function efeitoTexto(c){
  const up=Object.entries(c.e).filter(([,v])=>v>0).map(([k])=>LEIT.find(x=>x.k===k).n);
  const dn=Object.entries(c.e).filter(([,v])=>v<0).map(([k])=>LEIT.find(x=>x.k===k).n);
  return [up.length?"Fortalece: "+up.join(", "):"", dn.length?"Enfraquece: "+dn.join(", "):""].filter(Boolean).join(" · ");
}

function atualizarSim(){
  if(!simEls) return;
  const {diff,alerts}=calcular();
  document.querySelectorAll(".cc").forEach(b=>b.setAttribute("aria-pressed",ativas.has(b.dataset.id)?"true":"false"));
  // barreiras
  const bs=statusBarreiras(), ico={ok:"✓",falha:"✕",na:"–"};
  const com=bs.filter(b=>b.st==="ok").length;
  document.getElementById("barSum").textContent=`${com} de ${bs.length}`;

}

/* =========================================================
   TESTES (Validation Lab) — resultado observado
   ========================================================= */
let DB=null, testes=[], testeAberto=null, testeRascunho=null, prefillAB=null;

/* estatística: duas proporções */
function phi(z){ const t=1/(1+0.2316419*Math.abs(z)); const d=0.3989423*Math.exp(-z*z/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; }
function estat(t){
  const A=t.a||{}, B=t.b||{}, nA=Number(A.base)||0, xA=Number(A.conv)||0, nB=Number(B.base)||0, xB=Number(B.conv)||0;
  if(nA<=0||nB<=0) return {ok:false,msg:"Preencha a base (pessoas, visitas ou alcance) das duas versões."};
  if(xA>nA||xB>nB) return {ok:false,msg:"Conversões não podem ser maiores que a base."};
  const pA=xA/nA, pB=xB/nB, d=pB-pA, pp=(xA+xB)/(nA+nB);
  const se0=Math.sqrt(pp*(1-pp)*(1/nA+1/nB)), z=se0>0?d/se0:0, p=2*(1-phi(Math.abs(z)));
  const se=Math.sqrt(pA*(1-pA)/nA+pB*(1-pB)/nB), lo=d-1.96*se, hi=d+1.96*se;
  const ciA=[Math.max(0,pA-1.96*Math.sqrt(pA*(1-pA)/nA)),Math.min(1,pA+1.96*Math.sqrt(pA*(1-pA)/nA))];
  const ciB=[Math.max(0,pB-1.96*Math.sqrt(pB*(1-pB)/nB)),Math.min(1,pB+1.96*Math.sqrt(pB*(1-pB)/nB))];
  let nNec=null;
  if(d!==0){ const pm=(pA+pB)/2; nNec=Math.ceil(Math.pow(1.96*Math.sqrt(2*pm*(1-pm))+0.8416*Math.sqrt(pA*(1-pA)+pB*(1-pB)),2)/(d*d)); }
  const poucas=Math.min(xA,xB)<30;
  let veredito, vk;
  if(p<0.05&&!poucas){ vk="ok"; veredito=(d>0?"B":"A")+" venceu — a diferença provavelmente é real."; }
  else if(p<0.05&&poucas){ vk="warn"; veredito="Sinal a favor de "+(d>0?"B":"A")+", mas com poucas conversões. Continue o teste antes de decidir."; }
  else { vk="warn"; veredito="Inconclusivo: com esta amostra, a diferença ainda pode ser ruído."; }
  const custo=v=>{const inv=Number(v.inv)||0, c=Number(v.conv)||0; return inv>0&&c>0?inv/c:null;};
  return {ok:true,pA,pB,d,lift:pA>0?d/pA:null,p,lo,hi,ciA,ciB,nNec,nA,nB,xA,xB,poucas,veredito,vk,cA:custo(A),cB:custo(B)};
}
const pct=v=>(v*100).toFixed(v<0.01?2:1).replace(".",",")+"%";
const brl=v=>v==null?"—":"R$ "+v.toFixed(2).replace(".",",");

function graficoAB(s,t){
  const max=Math.max(s.ciA[1],s.ciB[1])*1.15||0.01, W=420, x0=90, bw=W-x0-40;
  const row=(y,lbl,p,ci,col)=>`<text x="0" y="${y+15}" font-size="14" font-weight="700" fill="var(--ink)">${esc(lbl)}</text>
    <rect x="${x0}" y="${y}" width="${bw*p/max}" height="22" rx="5" fill="${col}"/>
    <line x1="${x0+bw*ci[0]/max}" x2="${x0+bw*ci[1]/max}" y1="${y+11}" y2="${y+11}" stroke="var(--ink)" stroke-width="2"/>
    <line x1="${x0+bw*ci[0]/max}" x2="${x0+bw*ci[0]/max}" y1="${y+4}" y2="${y+18}" stroke="var(--ink)" stroke-width="2"/>
    <line x1="${x0+bw*ci[1]/max}" x2="${x0+bw*ci[1]/max}" y1="${y+4}" y2="${y+18}" stroke="var(--ink)" stroke-width="2"/>
    <text x="${Math.min(x0+bw*ci[1]/max+8,W-36)}" y="${y+16}" font-size="13" font-weight="700" fill="var(--ink)">${pct(p)}</text>`;

    ${row(6,(t.a&&t.a.nome)||"A",s.pA,s.ciA,"var(--soft)")}${row(50,(t.b&&t.b.nome)||"B",s.pB,s.ciB,"color-mix(in srgb,var(--accent) 70%,transparent)")}</svg>`;
}
function blocoResultado(t){
  const s=estat(t);
  if(!s.ok) return `<p class="note" style="margin:0">${esc(s.msg)}</p>`;
  const falta=s.nNec?Math.max(0,s.nNec-Math.min(s.nA,s.nB)):null, prog=s.nNec?Math.min(100,Math.round(Math.min(s.nA,s.nB)/s.nNec*100)):100;
  return `<div class="alert a-${s.vk}" style="font-size:15.5px"><b>${esc(s.veredito)}</b></div>
    <div style="margin-top:12px">${graficoAB(s,t)}</div>
    <p class="note" style="margin:4px 0 0">A barra é a taxa; o traço é a margem de erro (95%). Traços que se sobrepõem muito = ainda não dá para separar.</p>
    <div class="ibox" style="margin-top:12px">
      <div><span class="lab">Diferença (B − A)</span><b>${(s.d>=0?"+":"")+(s.d*100).toFixed(2).replace(".",",")} p.p.</b><div class="note">${s.lift!=null?(s.lift>=0?"+":"")+(s.lift*100).toFixed(0)+"% relativo":""}</div></div>
      <div><span class="lab">Faixa provável da diferença</span><b>${(s.lo*100).toFixed(2).replace(".",",")} a ${(s.hi*100).toFixed(2).replace(".",",")} p.p.</b><div class="note">${s.lo<0&&s.hi>0?"inclui zero: pode não haver diferença":"não inclui zero"}</div></div>
      <div><span class="lab">Chance de ser só acaso (p)</span><b>${s.p<0.001?"< 0,1%":(s.p*100).toFixed(1).replace(".",",")+"%"}</b><div class="note">abaixo de 5% costuma indicar diferença real</div></div>
      <div><span class="lab">Custo por conversão</span><b>A ${brl(s.cA)} · B ${brl(s.cB)}</b></div>
    </div>
    ${s.nNec?`<div style="margin-top:12px"><div class="lrow" style="margin:0"><span class="lab">Amostra para detectar esta diferença</span><span class="note">${s.nNec.toLocaleString("pt-BR")} por versão</span></div>
      <div class="bar" style="height:10px;margin-top:6px"><i style="width:${prog}%;background:${prog>=100?"var(--ok)":"var(--warn)"}"></i></div>
      <p class="note" style="margin:6px 0 0">${falta>0?`Faltam cerca de ${falta.toLocaleString("pt-BR")} por versão. Não encerre o teste antes: parar quando o número "fica bom" é a principal causa de vitória falsa.`:"Amostra suficiente para esta diferença (poder de 80%)."}</p></div>`:""}`;
}
function statusPill(st){const m={planejado:["Planejado","var(--soft)"],rodando:["Rodando","var(--warnbg)"],concluido:["Concluído","var(--okbg)"]}[st||"planejado"]||["—","var(--soft)"];
  return `<span class="pill" style="background:${m[1]}">${m[0]}</span>`;}

    <div class="card"><div class="lrow" style="margin:0"><span class="lab">Mecanismos em uso</span><a class="btn ghost" href="#simulador" style="text-decoration:none;padding:6px 12px">Mudar no Laboratório</a></div><div class="chips" id="mecs" style="margin-top:8px"></div></div></div>`);
  view.append(top);
  Object.entries(CANAIS).forEach(([k,c])=>{const b=$(`<button type="button" class="btn ${k===clCanal?"":"ghost"}">${esc(c.n)}</button>`);b.onclick=()=>{clCanal=k;renderCreative();};top.querySelector("#canais").append(b);});
  const mc=top.querySelector("#mecs");
  if(!ativas.size) mc.append($(`<span class="note">Nenhum mecanismo ligado. Abra o Laboratório e ligue os que atacam as barreiras.</span>`));
  [...ativas].forEach(id=>{const c=CMAP[id];mc.append($(`<span class="chip" style="background:${c.trap?"var(--badbg)":"var(--soft)"}">${c.trap?"Remover: ":""}${esc(c.n)}</span>`));});

  // barreiras sem mecanismo
  const semMec=statusBarreiras().filter(b=>b.st!=="ok"&&b.peso);
  if(semMec.length){
    const s=$(`<section class="sec card"><h2>Barreiras ainda sem resposta</h2><p class="note" style="margin:4px 0 8px">Mecanismos que atacam cada uma — ligue no Laboratório se fizer sentido.</p></section>`);
    semMec.forEach(b=>{const sug=CARTAS.filter(c=>!c.trap&&(EXTRA[c.id]||{}).b&&EXTRA[c.id].b.includes(b.id)).map(c=>c.n);
      s.append($(`<div class="ci s-${b.st==="falha"?"falha":"na"}" style="margin-top:6px"><span class="ic i-${b.st==="falha"?"falha":"na"}">${b.st==="falha"?"✕":"–"}</span><div><b>${esc(b.nome)}</b><span class="n">Opções: ${esc(sug.join(", "))}</span></div></div>`));});
    view.append(s);
  }

  // diretrizes por área
  const grupos={}, ordem=["Remover","Fotografia","Luz","Composição","Layout","Direção de arte","Tipografia","Cor","Copy","Roteiro","Vídeo","Áudio","Produção"];
  [...ativas].forEach(id=>(DIR[id]||[]).forEach(([ar,tx,nv])=>{(grupos[ar]=grupos[ar]||[]).push({tx,nv,c:CMAP[id]});}));
  const areas=Object.keys(grupos).sort((a,b)=>(ordem.indexOf(a)+99)%99-(ordem.indexOf(b)+99)%99);
  if(areas.length){
    const s=$(`<section class="sec"><div class="shead"><h2>Direção criativa</h2><p>Agrupada por área de execução.</p></div><div class="grid auto" style="align-items:start"></div></section>`);
    areas.forEach(ar=>{const c=$(`<div class="card" style="${ar==="Remover"?"background:var(--badbg)":""}"><h3>${esc(ar==="Remover"?"Remover primeiro":ar)}</h3></div>`);
      grupos[ar].forEach(it=>c.append($(`<div style="margin-top:10px"><p style="margin:0">${esc(it.tx)}</p><div class="pills" style="margin-top:4px">${it.nv==="ev"?evc(it.c.ev):`<span class="pill">Prática de ofício</span>`}<span class="pill">${esc(it.c.n)}</span></div></div>`)));
      s.querySelector(".grid").append(c);});
    view.append(s);
  }
  // specs do canal
  view.append($(`<section class="sec card"><div class="lrow" style="margin:0"><h2>${esc(CANAIS[clCanal].n)}</h2><span class="pill">Especificação de plataforma · confira a regra atual</span></div>
    <ul style="margin:10px 0 0;padding-left:18px">${CANAIS[clCanal].spec.map(x=>`<li style="margin:4px 0">${esc(x)}</li>`).join("")}</ul></section>`));

  // briefing completo
  const bx=$(`<section class="sec card form"><h2>Briefing</h2><p class="note" style="margin:4px 0 8px">Base montada a partir das escolhas acima. Peça ao Claude para transformar em briefing completo, com lista de fotos e 3 opções de título.</p>
    <textarea id="brief" style="min-height:220px">${esc(briefTxt||briefingTexto())}</textarea>
    <div class="btnrow"><button class="btn" type="button" id="bBriefIA">Gerar briefing completo com o Claude</button><button class="btn ghost" type="button" id="bCopiar">Copiar</button><button class="btn ghost" type="button" id="bSalvarBrief">Salvar no histórico</button><button class="btn ghost" type="button" id="bRefazer">Refazer a partir das escolhas</button><span class="note" id="briefNote"></span></div></section>`);
  view.append(bx);
  const ta=bx.querySelector("#brief"), note=bx.querySelector("#briefNote"), ia=bx.querySelector("#bBriefIA");
  ta.addEventListener("input",()=>briefTxt=ta.value);
  bx.querySelector("#bRefazer").onclick=()=>{briefTxt="";ta.value=briefingTexto();note.textContent="";};
  bx.querySelector("#bCopiar").onclick=()=>{ navigator.clipboard.writeText(ta.value).then(()=>note.textContent="Copiado.",()=>{ta.select();note.textContent="Selecionado: use Ctrl+C.";}); };
  bx.querySelector("#bSalvarBrief").onclick=async e=>{
    if(!DB){note.textContent="Abra o Studio no claude.ai para salvar.";return;}
    e.target.disabled=true;
    try{ await DB.collection("briefings").doc().set({analise_id:atual?atual.id:"",titulo:(atual?atual.titulo:"Estratégia livre")+" — "+CANAIS[clCanal].n,canal:clCanal,mecanismos:[...ativas],texto:ta.value,criado:new Date().toISOString()}); note.textContent="Salvo no histórico de briefings."; }
    catch(err){ note.textContent="Não consegui salvar."; }
    e.target.disabled=false; };
  if(!samplePromise) samplePromise=(window.claude&&window.claude.use)?window.claude.use("sample"):Promise.resolve(null);
  samplePromise.then(sm=>{ if(!sm){ia.disabled=true;note.textContent="O briefing com o Claude funciona no claude.ai.";} });
  ia.onclick=async()=>{ const sm=await samplePromise; if(!sm) return; ia.disabled=true; note.textContent="Escrevendo…";
    const a=atual?JSON.parse(JSON.stringify(atual)):{}; delete a.imagens;
    const prompt="Você é diretor de criação da ROD, especialista em neuromarketing. Transforme a base abaixo num briefing criativo pronto para fotógrafo, designer e redator, em português do Brasil. Estrutura: 1) Objetivo e hipótese comportamental (2 frases). 2) Conceito em uma linha. 3) Lista de fotos/cenas (5 itens: enquadramento, lente equivalente, luz, ação). 4) Layout e hierarquia (ordem de leitura). 5) Tipografia e cor (sem citar marcas de terceiros). 6) Copy: 3 opções de título + 1 CTA. 7) Especificações do canal. 8) O que não fazer. Mantenha as marcações [Evidência]/[Prática de ofício]. Nunca recomende prática enganosa, nunca invente número ou depoimento (use [DADO REAL: …]).\n\nBASE:\n"+ta.value+"\n\nANÁLISE (contexto):\n"+JSON.stringify(a).slice(0,9000);
    try{ const r=await sm(prompt,{onText:({text})=>{ta.value=text;},cache:false,modelTier:"default"}); ta.value=r.text; briefTxt=r.text; note.textContent="Revise e salve."; }
    catch(err){ note.textContent=err&&err.code==="rate_limited"?"Muitas chamadas seguidas; espere um pouco.":"Não consegui gerar agora."; }
    ia.disabled=false; };

  // briefings salvos desta análise
  const meus=briefings.filter(b=>!atual||b.analise_id===atual.id);
  if(meus.length){
    const s=$(`<section class="sec"><div class="shead"><h2>Briefings salvos</h2></div><div class="hist"></div></section>`);
    meus.forEach(b=>{const el=$(`<button type="button" class="hi"><span style="min-width:0"><b>${esc(b.titulo)}</b><div class="meta">${b.criado?new Date(b.criado).toLocaleString("pt-BR"):""}</div></span></button>`);
      el.onclick=()=>{briefTxt=b.texto||"";clCanal=b.canal||clCanal;renderCreative();window.scrollTo({top:document.getElementById("brief").offsetTop-120});};
      s.querySelector(".hist").append(el);});
    view.append(s);
  }
}

function renderJornada(){

  const at=$(`<section class="sec"><div class="shead"><h2>Atlas do cérebro</h2><p>Toque numa região no cérebro ou na lista. Regiões acesas = associadas aos mecanismos ligados no Laboratório.</p></div>

function renderAprendizados(){
  view.innerHTML="";
  view.append($(`<header><h1>Aprendizados</h1><p class="lead">O que os seus testes mostram sobre o seu público, mecanismo por mecanismo. Com o tempo, isso vale mais que qualquer tabela genérica de neuromarketing.</p>
    <div class="chips">${lvl("res")}<span class="note" style="align-self:center">Só entram testes com números. Poucos testes = sinal fraco; o Studio diz quando.</span></div></header>`));
  const conc=testes.map(t=>({t,s:estat(t)})).filter(x=>x.s.ok);
  // por mecanismo
  const tab={};
  conc.forEach(({t,s})=>{
    const A=analises.find(a=>a.id===t.analise_a), B=analises.find(a=>a.id===t.analise_b); if(!A||!B) return;
    const ma=new Set((A.simulador||{}).ativas||[]), mb=new Set((B.simulador||{}).ativas||[]);
    const venc=s.vk==="ok"?(s.d>0?"b":"a"):null;
    const reg=(id,lado)=>{const r=tab[id]=tab[id]||{apoia:0,contra:0,inconc:0,testes:[]};
      if(!venc) r.inconc++; else if((lado==="a"&&venc==="a")||(lado==="b"&&venc==="b")) r.apoia++; else r.contra++;
      r.testes.push(t.titulo||"Teste");};
    ma.forEach(id=>{if(!mb.has(id)&&CMAP[id]) reg(id,"a");});
    mb.forEach(id=>{if(!ma.has(id)&&CMAP[id]) reg(id,"b");});
  });
  const linhas=Object.entries(tab).sort((a,b)=>(b[1].apoia-b[1].contra)-(a[1].apoia-a[1].contra));
  const s1=$(`<section class="sec card"><div class="lrow" style="margin:0"><h2>Mecanismos no seu público</h2>${lvl("res")}</div>
    <p class="note" style="margin:4px 0 10px">Conta os testes em que a versão com o mecanismo (e a outra sem) venceu, perdeu ou empatou. Mecanismo dos dois lados não entra.</p><div id="mecTab"></div></section>`);
  const mt=s1.querySelector("#mecTab");
  if(!linhas.length) mt.append($(`<p style="margin:0">Ainda não há testes ligados a duas análises com mecanismos diferentes. Registre testes na aba Testes ligando as análises A e B.</p>`));
  linhas.forEach(([id,r])=>{const c=CMAP[id], n=r.apoia+r.contra+r.inconc;
    const sinal=n<3?"Sinal fraco (menos de 3 testes)":r.apoia>r.contra?"Tende a funcionar no seu público":r.contra>r.apoia?"Tende a não funcionar no seu público":"Sem direção clara";
    mt.append($(`<div class="meter" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;padding:10px 0;border-top:1px solid var(--line)">
      <div><b>${esc(c.n)}</b> ${evc(c.ev)}<div class="note">${esc(sinal)}</div></div>
      <div class="bar" style="height:12px;display:flex"><i style="width:${r.apoia/n*100}%;background:var(--ok);border-radius:0"></i><i style="width:${r.inconc/n*100}%;background:var(--na);border-radius:0"></i><i style="width:${r.contra/n*100}%;background:var(--bad);border-radius:0"></i></div>
      <span class="note" style="white-space:nowrap">${r.apoia} venceu · ${r.inconc} empate · ${r.contra} perdeu</span></div>`));});
  view.append(s1);
  // barreiras mais comuns
  const cont={}; analises.forEach(a=>(a.barreiras||[]).forEach(b=>{if(BARR[b.id])cont[b.id]=(cont[b.id]||0)+(b.peso==="alto"?2:1);}));
  const top=Object.entries(cont).sort((a,b)=>b[1]-a[1]);
  const s2=$(`<section class="sec card"><div class="lrow" style="margin:0"><h2>Barreiras que mais aparecem</h2>${lvl("hip")}</div><p class="note" style="margin:4px 0 10px">Somadas em todas as análises (peso alto conta em dobro). Mostra onde seus clientes mais travam.</p></section>`);
  if(!top.length) s2.append($(`<p style="margin:0">Ainda sem barreiras registradas.</p>`));
  const mx=top.length?top[0][1]:1;
  top.forEach(([id,v])=>s2.append($(`<div class="meter" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 40px"><b>${esc(BARR[id].n)}</b><div class="bar"><i style="width:${v/mx*100}%;background:var(--accent)"></i></div><span class="val">${v}</span></div>`)));
  view.append(s2);
  // números gerais e aprendizados escritos
  const venc=conc.filter(x=>x.s.vk==="ok").length;
  view.append($(`<section class="sec grid auto"><div class="card"><span class="lab">Análises</span><div class="big">${analises.length}</div></div>
    <div class="card"><span class="lab">Testes com números</span><div class="big">${conc.length}</div></div>
    <div class="card"><span class="lab">Com vencedor claro</span><div class="big">${venc}</div><span class="note">${conc.length?Math.round(venc/conc.length*100)+"% dos testes":"—"}</span></div></section>`));
  const apr=testes.filter(t=>t.aprendizado);
  const s3=$(`<section class="sec"><div class="shead"><h2>O que cada teste ensinou</h2></div><div class="grid auto"></div></section>`);
  if(!apr.length) s3.querySelector(".grid").append($(`<div class="card"><p style="margin:0">Os aprendizados escritos nos testes aparecem aqui.</p></div>`));
  apr.forEach(t=>s3.querySelector(".grid").append($(`<div class="card"><b>${esc(t.titulo)}</b>${t.veredito?`<div class="note" style="margin-top:4px">${esc(t.veredito)}</div>`:""}<p style="margin:10px 0 0;white-space:pre-wrap">${esc(t.aprendizado)}</p></div>`)));
  view.append(s3);
  const sb=$(`<section class="sec card"><h2>Resumo para a próxima campanha</h2><p class="note" style="margin:4px 0 10px">O Claude lê todos os testes e aprendizados e escreve as regras da casa para o seu público.</p>
    <div class="btnrow"><button class="btn" type="button" id="bRegras">Gerar regras da casa</button><span class="note" id="regNote"></span></div><div class="msg c" id="regTxt" style="margin-top:12px;max-width:none" hidden></div></section>`);
  view.append(sb);
  const bR=sb.querySelector("#bRegras"), rn=sb.querySelector("#regNote"), rt=sb.querySelector("#regTxt");
  if(!samplePromise) samplePromise=(window.claude&&window.claude.use)?window.claude.use("sample"):Promise.resolve(null);
  samplePromise.then(sm=>{ if(!sm){bR.disabled=true;rn.textContent="Funciona no claude.ai.";} else if(!conc.length){bR.disabled=true;rn.textContent="Registre testes com números primeiro.";} });
  bR.onclick=async()=>{ const sm=await samplePromise; if(!sm) return; bR.disabled=true; rn.textContent="Lendo os testes…"; rt.hidden=false;
    const dados=conc.map(({t,s})=>({titulo:t.titulo,hipotese:t.hipotese,metrica:t.metrica,publico:t.publico,canal:t.canal,taxaA:s.pA,taxaB:s.pB,p:s.p,veredito:s.veredito,aprendizado:t.aprendizado,mecA:(analises.find(a=>a.id===t.analise_a)||{simulador:{}}).simulador.ativas,mecB:(analises.find(a=>a.id===t.analise_b)||{simulador:{}}).simulador.ativas}));
    const prompt="Você é o analista de neuromarketing da ROD. A partir dos testes A/B abaixo, escreva em português simples até 6 'regras da casa' para o próximo trabalho com este público. Para cada regra: a regra, em quais testes se apoia e o quão forte é o sinal (fraco se poucos testes ou inconclusivos). Não generalize além dos dados; diga o que ainda precisa ser testado. Dados:\n"+JSON.stringify({testes:dados,mecanismos:tab}).slice(0,12000);
    try{ const r=await sm(prompt,{onText:({text})=>{rt.textContent=text;},cache:false}); rt.textContent=r.text; rn.textContent=""; }
    catch(err){ rn.textContent="Não consegui agora."; }
    bR.disabled=false; };
}

/* =========================================================
   HISTÓRICO
   ========================================================= */
function renderHist(){
  view.innerHTML="";
  view.append($(`<header><h1>Histórico</h1><p class="lead">Todas as análises feitas com o Claude. Toque para abrir.</p></header>`));
  if(!analises.length){view.append(vazio());return;}
  const l=$(`<div class="hist sec"></div>`);
  analises.forEach(a=>{const n=Number(a.nota)||0,c=n>=4?"var(--ok)":n>=3?"var(--warn)":"var(--bad)";
    const b=$(`<button type="button" class="hi"><span class="nota" style="color:${c}">${n}</span><span style="min-width:0"><b>${esc(a.titulo)}</b><div class="meta">${esc((a.contexto&&a.contexto.tipo)||"Análise")} · ${a.criado?new Date(a.criado).toLocaleDateString("pt-BR"):""}${a.resumo?" · "+esc(a.resumo):""}</div></span></button>`);
    b.onclick=()=>{selecionar(a.id);location.hash="painel";};l.append(b);});
  view.append(l);
}

/* =========================================================
   PERGUNTE AO CLAUDE
   ========================================================= */
let samplePromise=null;
function contexto(){
  const {s}=calcular(); const a=atual?JSON.parse(JSON.stringify(atual)):null;
  if(a&&a.imagens) delete a.imagens;
  return JSON.stringify({analise:a,simulador:{cartas_ligadas:[...ativas].map(i=>CMAP[i].n),notas_previstas:s}});
}
function renderAsk(){
  view.innerHTML="";
  view.append($(`<header><h1>Pergunte ao Claude</h1><p class="lead">Perguntas sobre ${atual?`<b>${esc(atual.titulo)}</b>`:"neuromarketing"}. As respostas usam a análise e as cartas que você ligou no Simulador.</p></header>`));
  const box=$(`<div class="card ask sec">
    <div class="btnrow" style="margin-top:0">
      <button class="btn ghost" type="button" data-q="Explica essa análise como se eu tivesse 15 anos, em poucos parágrafos curtos.">Explica como se eu tivesse 15 anos</button>
      <button class="btn ghost" type="button" data-q="Qual carta do simulador eu deveria ligar ou desligar primeiro, e por quê?">Qual carta mudo primeiro?</button>
      <button class="btn ghost" type="button" data-q="Quais são os 3 maiores riscos desta peça e como resolver cada um?">Maiores riscos</button>
    </div>
    <label class="lab" for="askTxt" style="margin-top:14px">Sua pergunta</label>
    <textarea id="askTxt" placeholder="Ex.: se eu trocar a coroa por outra coisa, a marca fica mais confiável?"></textarea>
    <div class="btnrow"><button class="btn" type="button" id="askGo">Perguntar</button><span class="note" id="askNote"></span></div>
    <div class="chat" id="chat"></div></div>`);
  view.append(box);
  const chatEl=box.querySelector("#chat"), note=box.querySelector("#askNote"), go=box.querySelector("#askGo"), ta=box.querySelector("#askTxt");
  const draw=()=>{chatEl.innerHTML="";chat.forEach(m=>chatEl.append($(`<div class="msg ${m.role==="user"?"u":"c"}"></div>`)));[...chatEl.children].forEach((el,i)=>el.textContent=chat[i].shown||chat[i].content);};
  draw();
  if(!samplePromise) samplePromise=(window.claude&&window.claude.use)?window.claude.use("sample"):Promise.resolve(null);
  samplePromise.then(sample=>{ if(!sample){ go.disabled=true; box.querySelectorAll("[data-q]").forEach(b=>b.disabled=true); note.textContent="Disponível quando o Studio é aberto no claude.ai com sua conta."; } });
  async function perguntar(q){
    const sample=await samplePromise; if(!sample||!q.trim()) return;
    const sys="Você é o analista de neuromarketing da ROD. Responda em português do Brasil, simples e direto, como para alguém de 15 anos quando pedido. Base científica: diga se algo é comprovado, depende do público ou é hipótese. Nunca use mitos (95% inconsciente, ocitocina, cérebro reptiliano, dopamina do prazer). Nunca recomende prática enganosa. Contexto da análise atual em JSON:\n"+contexto();
    chat.push({role:"user",content:q}); const resp={role:"assistant",content:"",shown:"Pensando…"}; chat.push(resp); draw(); go.disabled=true; ta.value="";
    const msgs=chat.slice(0,-1).map((m,i)=>({role:m.role,content:i===0?sys+"\n\nPergunta: "+m.content:m.content}));
    try{ const r=await sample(msgs,{onText:({text})=>{resp.shown=text;chatEl.lastElementChild.textContent=text;},cache:false});
      resp.content=r.text; resp.shown=r.text; }
    catch(e){ resp.content=""; resp.shown=e&&e.code==="rate_limited"?"Muitas perguntas seguidas. Espere um pouco e tente de novo.":e&&e.code==="not_granted"?"O acesso ao Claude não foi permitido nesta página.":"Não consegui responder agora."; chat.pop(); chat.pop(); chat.push({role:"user",content:q,shown:q}); }
    draw(); go.disabled=false;
  }
  go.onclick=()=>perguntar(ta.value);
  box.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>perguntar(b.dataset.q));
}

/* =========================================================
   CARREGAR ANÁLISES DO BANCO
   ========================================================= */
function preencherSelect(){
  sel.innerHTML="";
  if(!analises.length){sel.append(new Option("Nenhuma análise","")); return;}
  analises.forEach(a=>sel.append(new Option(a.titulo||a.id,a.id)));
  sel.value=atual?atual.id:"";
}
let carregou=false;
function iniciar(){
  marcarAba(); render();
  const timer=setTimeout(()=>{ if(!carregou){ sel.innerHTML=""; sel.append(new Option("Sem conexão com o banco","")); } },10000);
  const use=(window.claude&&window.claude.use)?window.claude.use("db"):Promise.resolve(null);
  use.then(db=>{
    DB=db;
    if(!db){ clearTimeout(timer); carregou=true; preencherSelect(); render(); return; }
    db.collection("briefings").orderBy("criado","desc").onSnapshot(snap=>{
      briefings=snap.docs.map(d=>({id:d.id,...d.data()}));
    },()=>{});
    db.collection("testes").orderBy("criado","desc").onSnapshot(snap=>{
      testes=snap.docs.map(d=>({id:d.id,...d.data()}));
      const r=rota();
      if((r==="testes"&&!testeAberto)||r==="painel"||r==="aprendizados") render();
    },()=>{});
    db.collection("analises").orderBy("criado","desc").onSnapshot(snap=>{
      if(!snap.metadata.fromCache){ clearTimeout(timer); carregou=true; }
      analises=snap.docs.map(d=>({id:d.id,...d.data()}));
      let pref=null; try{pref=localStorage.getItem("rodns.analise");}catch(e){}
      const manter = atual && analises.find(a=>a.id===atual.id);
      if(manter){ atual=manter; preencherSelect(); if(rota()!=="simulador") render(); }
      else { preencherSelect(); selecionar((analises.find(a=>a.id===pref)||analises[0]||{}).id); }
    }, ()=>{ clearTimeout(timer); carregou=true; preencherSelect(); render(); });
  });
}
iniciar();
</script>
