<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Neuromarketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1ea; --card:#fffdf9; --ink:#15130f; --mute:#6b655b; --line:#e7e0d4; --soft:#efe9df;
  --accent:#e2462c; --ok:#1f9d6b; --warn:#d99a10; --bad:#d5432f; --na:#a39d92;
  --okbg:#e3f4ec; --warnbg:#fbf0d6; --badbg:#fbe4df; --nabg:#efebe4;
  --robusto:#1f9d6b; --contextual:#b97d00; --testar:#7a5cd6;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12110e; --card:#1b1a16; --ink:#f3efe7; --mute:#a59f93; --line:#2c2a24; --soft:#24221d;
  --okbg:#15362a; --warnbg:#3a2e10; --badbg:#3d1d17; --nabg:#2a2823; --contextual:#e0a62a; --testar:#a48cf0;
}}
:root[data-theme="dark"]{
  --bg:#12110e; --card:#1b1a16; --ink:#f3efe7; --mute:#a59f93; --line:#2c2a24; --soft:#24221d;
  --okbg:#15362a; --warnbg:#3a2e10; --badbg:#3d1d17; --nabg:#2a2823; --contextual:#e0a62a; --testar:#a48cf0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:clamp(26px,4vw,40px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;margin:0 0 4px;font-weight:750;letter-spacing:-.01em}
.sub{color:var(--mute);margin:6px 0 0;max-width:70ch}
.section{margin-top:28px}
.shead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.shead p{margin:0;color:var(--mute);font-size:14.5px}
.card{background:var(--card);border-radius:18px;padding:20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--soft);border-radius:999px;padding:5px 12px;font-size:13.5px}
.chip b{font-weight:650;color:var(--mute);margin-right:4px}
details.how{margin-top:10px;font-size:14px;color:var(--mute)}
details.how summary{cursor:pointer;font-weight:600;color:var(--ink);list-style:none}
details.how summary::before{content:"?";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;
  background:var(--soft);margin-right:8px;font-size:12px}
details.how p{margin:8px 0 0}

/* topo */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;margin-top:22px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.peca{display:grid;place-items:center;background:var(--card);border-radius:18px;padding:18px;min-height:260px}
.peca img{max-width:100%;max-height:380px;object-fit:contain;border-radius:8px}
.nota{display:flex;flex-direction:column;justify-content:space-between}
.gauge{display:flex;align-items:center;gap:18px}
.gauge svg{flex:none}
.big{font-size:52px;font-weight:800;line-height:1}
.big small{font-size:22px;color:var(--mute);font-weight:600}
.verdict{font-size:18px;font-weight:650;margin:4px 0 0}
.resumo{font-size:16.5px;margin:16px 0 0;padding-top:16px;border-top:1px solid var(--line)}

/* leituras */
.leit{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.lcard{background:var(--card);border-radius:18px;padding:18px;position:relative}
.ltop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ltop h3{margin:0;font-size:17px}
.score{font-weight:800;font-size:22px}
.score small{font-size:13px;color:var(--mute);font-weight:600}
.bar{height:8px;background:var(--soft);border-radius:4px;margin:10px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.lcard p{margin:0;font-size:15px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}

/* radar + checklist */
.radar svg{width:100%;height:auto;max-width:420px;display:block;margin:0 auto}
.check{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px}
.ci{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:14.5px}
.ci .ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.ci b{display:block;font-size:14.5px}
.ci span{color:var(--mute);font-size:13.5px}
.s-ok{background:var(--okbg)} .s-ok .ic{background:var(--ok)}
.s-parcial{background:var(--warnbg)} .s-parcial .ic{background:var(--warn)}
.s-falha{background:var(--badbg)} .s-falha .ic{background:var(--bad)}
.s-na{background:var(--nabg)} .s-na .ic{background:var(--na)}

/* semáforo */
.sem{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.semc{border-radius:18px;padding:18px}
.semc h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.semc ul{margin:0;padding-left:18px}
.semc li{margin:4px 0;font-size:15px}
.v{background:var(--okbg)} .a{background:var(--warnbg)} .r{background:var(--badbg)}

/* correções */
.corr{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px}
@media (max-width:860px){.corr{grid-template-columns:1fr}}
.matrix svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.matrix{align-self:start}
figure.wide{grid-column:1/-1}
.fix{background:var(--card);border-radius:18px;padding:18px}
.fix + .fix{margin-top:12px}
.fixh{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800}
.fix h3{margin:2px 0 6px;font-size:17px}
.rows{display:grid;grid-template-columns:88px 1fr;gap:4px 12px;font-size:14.5px;margin-top:6px}
.rows dt{color:var(--mute);font-weight:600}
.rows dd{margin:0}
.ex{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:14.5px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:12.5px;font-weight:650;border-radius:999px;padding:3px 10px;background:var(--soft)}
.ev{font-size:11.5px;font-weight:800;letter-spacing:.04em;border-radius:999px;padding:3px 9px;white-space:nowrap}
.ev-ROBUSTO{color:var(--robusto);background:color-mix(in srgb,var(--robusto) 14%,transparent)}
.ev-CONTEXTUAL{color:var(--contextual);background:color-mix(in srgb,var(--contextual) 16%,transparent)}
.ev-TESTAR{color:var(--testar);background:color-mix(in srgb,var(--testar) 14%,transparent)}

/* imagens */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
figure{margin:0;background:var(--card);border-radius:18px;padding:14px}
figure img{width:100%;border-radius:10px;display:block}
figcaption{font-size:14px;color:var(--mute);margin-top:8px}
.btn{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;border-radius:999px;padding:10px 18px;margin-top:10px}

/* versões e testes */
.vers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.vc{background:var(--card);border-radius:18px;padding:18px}
.vc.rec{outline:2px solid var(--accent)}
.vc .tag{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.04em}
.vc h3{margin:4px 0 6px;font-size:17px}
.vc p{margin:0;font-size:15px}
.vies{display:flex;gap:10px;align-items:flex-start;padding:10px 0}
.vies + .vies{border-top:1px solid var(--line)}
.vies b{display:block}
.vies span{color:var(--mute);font-size:14.5px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;font-size:14px;color:var(--mute)}
.legend div{background:var(--card);border-radius:14px;padding:14px}
.foot{margin-top:28px;color:var(--mute);font-size:13.5px}
.hide{display:none!important}
.quote{margin:0 0 16px;font-size:clamp(19px,2.4vw,24px);line-height:1.35;font-weight:650;letter-spacing:-.01em}
.ibox{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.ibox div{background:var(--soft);border-radius:12px;padding:12px 14px}
.ibox span{display:block;font-size:12.5px;font-weight:700;color:var(--mute);letter-spacing:.03em;text-transform:uppercase}
.ibox b{font-size:15.5px;font-weight:650}
.iprow{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1.2fr);gap:14px;padding:12px 0;font-size:15px;align-items:start}
.iprow + .iprow{border-top:1px solid var(--line)}
.ihead{font-size:12.5px;font-weight:700;color:var(--mute);letter-spacing:.03em;text-transform:uppercase;padding-top:0}
@media (max-width:700px){.iprow{grid-template-columns:1fr;gap:4px}.ihead{display:none}}
.sci{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.scard{background:var(--card);border-radius:18px;padding:18px}
.scard h3{margin:0;font-size:17px}
.sdiz{margin:10px 0 0;font-size:15px}
.sapl{margin:10px 0 0;font-size:15px;background:var(--soft);border-radius:10px;padding:10px 12px}
.sfonte{margin:10px 0 0;font-size:13px;color:var(--mute)}
.ideia-only{background:var(--card);border-radius:18px;padding:22px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const D = /*__DADOS__*/{
  "titulo":"Exemplo de painel","subtitulo":"Rode scripts/painel.py com um dados.json","contexto":{},"nota":3,
  "leituras":[],"checklist":[],"semaforo":{},"correcoes":[],"versoes":[],"testar":[],"vieses":[],"imagens":{}
}/*__FIM__*/;

const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstElementChild;};
const esc = (s)=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const evc = (e)=>{e=String(e||"A TESTAR").toUpperCase().replace(/[\[\]]/g,"");const k=e.includes("ROBUST")?"ROBUSTO":e.includes("CONTEXT")?"CONTEXTUAL":"TESTAR";
  return `<span class="ev ev-${k}">${k==="TESTAR"?"A TESTAR":k}</span>`;};
const stc = {verde:"var(--ok)",amarelo:"var(--warn)",vermelho:"var(--bad)"};
const how = (t)=>t?`<details class="how"><summary>Como ler</summary><p>${t}</p></details>`:"";
const app = document.getElementById("app");

/* ---------- topo ---------- */
const ctx = D.contexto||{};
const nota = Math.max(0,Math.min(5,Number(D.nota)||0));
const verd = ["Voltar ao briefing","Refazer a parte problemática","Revisar antes de apresentar","Entrega com ajuste","Entrega","Entrega"][Math.round(nota)];
const gaugeCol = nota>=4?"var(--ok)":nota>=3?"var(--warn)":"var(--bad)";
const arc = (()=>{const r=62,c=Math.PI*r;return `<svg width="150" height="90" viewBox="0 0 150 90" aria-hidden="true">
  <path d="M13,80 A62,62 0 0 1 137,80" fill="none" stroke="var(--soft)" stroke-width="14" stroke-linecap="round"/>
  <path d="M13,80 A62,62 0 0 1 137,80" fill="none" stroke="${gaugeCol}" stroke-width="14" stroke-linecap="round"
    stroke-dasharray="${c*nota/5} ${c}"/></svg>`})();
app.append($(`<header>
  <h1>${esc(D.titulo)}</h1>
  ${D.subtitulo?`<p class="sub">${esc(D.subtitulo)}</p>`:""}
  <div class="chips">${["tipo","categoria","publico","canal","objetivo","momento"].filter(k=>ctx[k]).map(k=>
    `<span class="chip"><b>${{tipo:"Analisando",categoria:"Categoria",publico:"Público",canal:"Canal",objetivo:"Objetivo",momento:"Momento"}[k]}</b>${esc(ctx[k])}</span>`).join("")}</div>
</header>`));
const hero = $(`<div class="hero"></div>`);
if(D.imagens&&D.imagens.peca) hero.append($(`<div class="peca"><img alt="Peça analisada" src="${D.imagens.peca}"></div>`));
hero.append($(`<div class="card nota">
  <div><div class="gauge">${arc}<div><div class="big">${nota}<small>/5</small></div><p class="verdict">${verd}</p></div></div>
  ${D.emocao?`<div class="chips"><span class="chip"><b>Emoção-alvo</b>${esc(D.emocao)}</span></div>`:""}
  ${how("A nota vem da escala ROD: 5 = passa nas seis leituras; 4 = um ponto amarelo; 3 = dois amarelos ou um vermelho de baixo impacto; 2 = um vermelho de alto impacto; 1 = falha em atenção ou clareza, o problema é anterior à peça.")}</div>
  ${D.resumo?`<p class="resumo">${esc(D.resumo)}</p>`:""}
</div>`));
if(!(D.imagens&&D.imagens.peca)) hero.style.gridTemplateColumns="1fr";
app.append(hero);

/* ---------- a ideia de quem criou ---------- */
const it=D.intencao||{};
if(it.ideia||it.sentir||it.fazer||it.pensar){
  const s=$(`<section class="section"><div class="shead"><h2>A ideia de quem criou</h2><p>Nas palavras do autor. Toda a análise mede a peça contra esta intenção.</p></div>
    <div class="card"><div class="intent"></div></div></section>`);
  const g=s.querySelector(".intent");
  if(it.ideia) g.append($(`<blockquote class="quote">“${esc(it.ideia)}”</blockquote>`));
  const blocks=[["pensar","Quer que pensem"],["sentir","Quer que sintam"],["fazer","Quer que façam"],["publico","Para quem"]].filter(([k])=>it[k]);
  if(blocks.length) g.append($(`<div class="ibox">${blocks.map(([k,t])=>`<div><span>${t}</span><b>${esc(it[k])}</b></div>`).join("")}</div>`));
  app.append(s);
}
if(D.intencao_percepcao&&D.intencao_percepcao.length){
  const icon={ok:"✓",parcial:"!",falha:"✕",na:"–"};
  const s=$(`<section class="section"><div class="shead"><h2>Intenção × percepção</h2><p>O que você quer provocar contra o que o público provavelmente vai sentir. A distância entre os dois é onde mora o ajuste.</p></div>
    <div class="card ipt"></div></section>`);
  const t=s.querySelector(".ipt");
  t.append($(`<div class="iprow ihead"><span></span><span>Sua intenção</span><span>Percepção provável</span></div>`));
  D.intencao_percepcao.forEach(r=>{const st=r.status||"parcial";
    t.append($(`<div class="iprow"><span class="ci s-${st}" style="padding:0;background:none"><span class="ic">${icon[st]}</span><b style="font-size:15px">${esc(r.aspecto)}</b></span>
      <span>${esc(r.intencao)}</span><span>${esc(r.percepcao)}${r.evidencia?" "+evc(r.evidencia):""}</span></div>`));});
  t.append($(`<div>${how("Verde: a peça entrega o que você quer. Amarelo: entrega em parte ou para parte do público. Vermelho: a percepção provável é diferente (ou oposta) da intenção. A percepção é estimativa baseada em evidência, não pesquisa com o seu público — confirme com o teste dos 5 segundos.")}</div>`));
  app.append(s);
}

/* ---------- seis leituras ---------- */
if(D.leituras&&D.leituras.length){
  const s=$(`<section class="section"><div class="shead"><h2>As seis leituras</h2><p>Na ordem em que o cérebro processa a peça. Se falha cedo, o resto não chega.</p></div><div class="leit"></div></section>`);
  const g=s.querySelector(".leit");
  D.leituras.forEach(l=>{
    const c=stc[l.status]||"var(--na)", n=Math.max(0,Math.min(10,Number(l.nota)||0));
    g.append($(`<div class="lcard"><div class="ltop"><h3><span class="dot" style="background:${c}"></span>${esc(l.nome)}</h3>
      <div class="score">${n}<small>/10</small></div></div>
      <div class="bar"><i style="width:${n*10}%;background:${c}"></i></div>
      <p>${esc(l.achado)}</p>${how(l.explica)}</div>`));
  });
  app.append(s);
}

/* ---------- radar + checklist ---------- */
const row=$(`<div class="grid g2 section"></div>`);
if(D.leituras&&D.leituras.length>=3){
  const N=D.leituras.length, cx=210, cy=190, R=140;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+Math.cos(a)*R*v, cy+Math.sin(a)*R*v];};
  let rings="";[.25,.5,.75,1].forEach(k=>{rings+=`<polygon points="${D.leituras.map((_,i)=>pt(i,k).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`;});
  let axes="",labels="";D.leituras.forEach((l,i)=>{const [x,y]=pt(i,1);axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const [lx,ly]=pt(i,1.17);labels+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="650" fill="var(--ink)">${esc(l.nome)}</text>`;});
  const poly=D.leituras.map((l,i)=>pt(i,(Number(l.nota)||0)/10).join(",")).join(" ");
  const dots=D.leituras.map((l,i)=>{const [x,y]=pt(i,(Number(l.nota)||0)/10);return `<circle cx="${x}" cy="${y}" r="5" fill="${stc[l.status]||"var(--na)"}"/>`}).join("");
  row.append($(`<div class="card radar"><h2>Perfil da peça</h2><p class="sub" style="margin-top:2px">Quanto mais cheio o desenho, mais equilibrada a peça.</p>
    <svg viewBox="0 0 420 390" role="img" aria-label="Radar das seis leituras">${rings}${axes}
    <polygon points="${poly}" fill="color-mix(in srgb,var(--accent) 22%,transparent)" stroke="var(--accent)" stroke-width="2.5"/>${dots}${labels}</svg></div>`));
}
if(D.checklist&&D.checklist.length){
  const icon={ok:"✓",parcial:"!",falha:"✕",na:"–"};
  const c=$(`<div class="card"><h2>Checklist dos 10 conceitos</h2><p class="sub" style="margin:2px 0 12px">Verde passa, amarelo parcial, vermelho falha, cinza não se aplica.</p><div class="check"></div></div>`);
  D.checklist.forEach(i=>{const st=i.status||"na";
    c.querySelector(".check").append($(`<div class="ci s-${st}"><span class="ic">${icon[st]||"–"}</span><div><b>${esc(i.nome)}</b>${i.nota?`<span>${esc(i.nota)}</span>`:""}</div></div>`));});
  row.append(c);
}
if(row.children.length) app.append(row);

/* ---------- semáforo ---------- */
const sm=D.semaforo||{};
if(sm.verde||sm.amarelo||sm.vermelho){
  const s=$(`<section class="section"><div class="shead"><h2>Semáforo</h2><p>O que manter, o que ajustar e o que está custando resultado agora.</p></div><div class="sem"></div></section>`);
  [["v","verde","Funciona","var(--ok)"],["a","amarelo","Funciona pela metade","var(--warn)"],["r","vermelho","Custa resultado","var(--bad)"]].forEach(([cls,k,t,col])=>{
    if(!sm[k]||!sm[k].length) return;
    s.querySelector(".sem").append($(`<div class="semc ${cls}"><h3><span class="dot" style="background:${col}"></span>${t}</h3><ul>${sm[k].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`));
  });
  app.append(s);
}

/* ---------- correções ---------- */
if(D.correcoes&&D.correcoes.length){
  const lvl={baixo:0,"médio":1,medio:1,alto:2};
  const s=$(`<section class="section"><div class="shead"><h2>Correções priorizadas</h2><p>Ordenadas por impacto ÷ esforço. Comece pelo canto superior esquerdo da matriz.</p></div><div class="corr"></div></section>`);
  const cell=86, ox=60, oy=20;
  let grid="";for(let i=0;i<3;i++)for(let j=0;j<3;j++){const best=(j===0&&i===0);grid+=`<rect x="${ox+j*cell}" y="${oy+i*cell}" width="${cell-4}" height="${cell-4}" rx="10" fill="${best?"var(--okbg)":"var(--soft)"}"/>`;}
  const pos=D.correcoes.map(c=>{const ef=lvl[(c.esforco||"medio").toLowerCase()]??1, im=2-(lvl[(c.impacto||"medio").toLowerCase()]??1);return [ef,im];});
  const tot={},seen={};pos.forEach(([e,i])=>{tot[e+"-"+i]=(tot[e+"-"+i]||0)+1;});
  let marks="";
  pos.forEach(([ef,im],k)=>{const key=ef+"-"+im, t=tot[key], n=seen[key]=(seen[key]||0)+1;
    const cols=Math.min(t,2), col=(n-1)%2, rowi=Math.floor((n-1)/2), rows=Math.ceil(t/2);
    const x=ox+ef*cell+cell/2-2+(col-(cols-1)/2)*34, y=oy+im*cell+cell/2-2+(rowi-(rows-1)/2)*34;
    marks+=`<circle cx="${x}" cy="${y}" r="15" fill="var(--ink)"/><text x="${x}" y="${y+1}" text-anchor="middle" dominant-baseline="middle" fill="var(--bg)" font-weight="800" font-size="14">${k+1}</text>`;});
  const axis=`<text x="${ox+1.5*cell}" y="${oy+3*cell+26}" text-anchor="middle" font-size="13" fill="var(--mute)" font-weight="600">Esforço →  baixo · médio · alto</text>
    <text transform="translate(18 ${oy+1.5*cell}) rotate(-90)" text-anchor="middle" font-size="13" fill="var(--mute)" font-weight="600">Impacto →  baixo · médio · alto</text>`;
  s.querySelector(".corr").append($(`<div class="card matrix"><h2>Impacto × esforço</h2><svg viewBox="0 0 330 320" role="img" aria-label="Matriz impacto por esforço">${grid}${marks}${axis}</svg>
    ${how("Cada número é uma correção. Canto verde (alto impacto, baixo esforço) = fazer primeiro. Canto oposto = deixar para depois ou descartar.")}</div>`));
  const list=$(`<div></div>`);
  D.correcoes.forEach((c,k)=>list.append($(`<div class="fix"><div class="fixh"><span class="num">${k+1}</span><div style="flex:1">
    <h3>${esc(c.titulo)}</h3>
    <dl class="rows"><dt>Por quê</dt><dd>${esc(c.porque)} ${evc(c.evidencia)}</dd><dt>Ajuste</dt><dd>${esc(c.ajuste)}</dd>
    ${c.exemplo?`<dt>Exemplo</dt><dd><div class="ex">${esc(c.exemplo)}</div></dd>`:""}</dl>
    <div class="pills"><span class="pill">Impacto: ${esc(c.impacto||"—")}</span><span class="pill">Esforço: ${esc(c.esforco||"—")}</span></div>
  </div></div></div>`)));
  s.querySelector(".corr").append(list);
  app.append(s);
}

/* ---------- atenção, imagens extras, mapa ---------- */
const figs=[];
if(D.imagens&&D.imagens.atencao) figs.push({src:D.imagens.atencao,titulo:"Rastreamento de atenção previsto",texto:D.atencao_texto||"Mapa de calor e ordem provável do olhar. Previsão por saliência, não eye-tracking real: rostos e texto grande puxam mais do que o modelo mostra."});
(D.imagens&&D.imagens.extras||[]).forEach(e=>figs.push(e));
if(figs.length||D.mapa_cerebral){
  const s=$(`<section class="section"><div class="shead"><h2>Visuais</h2><p>Atenção, comparações e o mapa cerebral da ação.</p></div><div class="figs"></div></section>`);
  figs.forEach(f=>s.querySelector(".figs").append($(`<figure class="${f.largo!==false&&f===figs[0]&&D.imagens.atencao?"wide":""}"><img alt="${esc(f.titulo)}" src="${f.src}"><figcaption><b>${esc(f.titulo)}</b>${f.texto?" — "+esc(f.texto):""}</figcaption></figure>`)));
  if(D.mapa_cerebral) s.querySelector(".figs").append($(`<figure><figcaption style="margin:0"><b>Mapa cerebral 3D</b> — regiões associadas aos processos que a ação envolve (atenção, valor, memória, emoção). Abre em outra aba e dá para girar.</figcaption><a class="btn" href="${esc(D.mapa_cerebral)}" target="_blank" rel="noopener">Abrir o cérebro 3D</a></figure>`));
  app.append(s);
}

/* ---------- a ciência por trás ---------- */
if(D.ciencia&&D.ciencia.length){
  const s=$(`<section class="section"><div class="shead"><h2>A ciência por trás</h2><p>Os achados de neurociência e economia comportamental que sustentam esta análise — e onde eles aparecem na sua ideia.</p></div><div class="sci"></div></section>`);
  D.ciencia.forEach(c=>s.querySelector(".sci").append($(`<div class="scard">
    <div class="ltop"><h3>${esc(c.conceito)}</h3>${evc(c.evidencia)}</div>
    <p class="sdiz">${esc(c.o_que_diz)}</p>
    ${c.aplicacao?`<p class="sapl"><b>Na sua ideia:</b> ${esc(c.aplicacao)}</p>`:""}
    ${c.fonte?`<p class="sfonte">${esc(c.fonte)}</p>`:""}</div>`)));
  app.append(s);
}

/* ---------- versões ---------- */
if(D.versoes&&D.versoes.length){
  const s=$(`<section class="section"><div class="shead"><h2>Caminhos possíveis</h2><p>Direções alternativas para a mesma peça.</p></div><div class="vers"></div></section>`);
  D.versoes.forEach(v=>s.querySelector(".vers").append($(`<div class="vc ${v.recomendada?"rec":""}">${v.recomendada?`<div class="tag">RECOMENDADA</div>`:""}<h3>${esc(v.nome)}</h3><p>${esc(v.descricao)}</p>${v.vies?`<div class="pills"><span class="pill">${esc(v.vies)}</span></div>`:""}</div>`)));
  app.append(s);
}

/* ---------- vieses e testes ---------- */
const row2=$(`<div class="grid g2 section"></div>`);
if(D.vieses&&D.vieses.length){
  const c=$(`<div class="card"><h2>Vieses escolhidos</h2><p class="sub" style="margin:2px 0 6px">Como cada um entra nesta peça.</p></div>`);
  D.vieses.forEach(v=>c.append($(`<div class="vies"><div style="flex:1"><b>${esc(v.nome)}</b><span>${esc(v.uso)}</span></div>${evc(v.evidencia)}</div>`)));
  row2.append(c);
}
if(D.testar&&D.testar.length){
  const c=$(`<div class="card"><h2>Para testar</h2><p class="sub" style="margin:2px 0 6px">Hipóteses — não afirmações. Uma mudança por vez.</p></div>`);
  D.testar.forEach(t=>c.append($(`<div class="vies"><div><b>${esc(t.hipotese)}</b><span>${esc(t.como)}</span></div></div>`)));
  row2.append(c);
}
if(row2.children.length) app.append(row2);

/* ---------- legenda ---------- */
app.append($(`<section class="section"><div class="shead"><h2>Como ler as etiquetas</h2></div><div class="legend">
  <div>${evc("ROBUSTO")}<p style="margin:8px 0 0">Replica em meta-análise ou em teste de campo. Pode afirmar.</p></div>
  <div>${evc("CONTEXTUAL")}<p style="margin:8px 0 0">Efeito real, mas depende do público, da categoria ou da cultura.</p></div>
  <div>${evc("A TESTAR")}<p style="margin:8px 0 0">Hipótese plausível sem base firme. Vale como teste, não como certeza.</p></div>
</div><p class="foot">${esc(D.rodape||"Análise de neuromarketing com evidência declarada. Neurociência não dá botão de compra: dá um mapa onde as decisões acontecem — o teste decide.")}</p></section>`));
</script>
</body>
</html>
