name: Deploy ROD Neuro Studio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rod-neuro-studio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate approved static website
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/rod-attention-v3.js
          test -s dist/rod-references-v3.js
          grep -q 'RESEARCH INTERFACE' dist/index.html
          grep -q 'rod-attention-v3.js' dist/index.html
          grep -q 'rod-references-v3.js' dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload redesigned static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
