name: Verify Studio v3 branch

on:
  push:
    branches:
      - feature/studio-v3
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-and-attention:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned analysis dependencies
        run: python -m pip install numpy==2.3.4 Pillow==12.0.0
      - name: Check static integrity and predictive attention
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check ROD-003/004 synthetic migration
        run: python tools/migrate_legacy.py tests/fixtures/legacy_synthetic.json --check
      - name: Check legacy Studio validator
        run: python skill/scripts/validar_studio.py

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Playwright
        run: python -m pip install playwright==1.56.0
      - name: Install Chromium and operating system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Test browser without publishing or accessing Claude
        run: python tests/browser_smoke.py
