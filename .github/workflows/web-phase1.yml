name: ROD v3 web foundation
on:
  push:
    branches:
      - feature/studio-v3
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  web-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund
      - name: Verify strict TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Compile standalone application without secrets
        run: npm run build
